name: reevibes_app
description: "ReeVibes - Premium Fashion Curation"
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ─── WebView ─────────────────────────────────────────
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0

  # ─── Connectivity ────────────────────────────────────
  connectivity_plus: ^6.1.0
  internet_connection_checker_plus: ^2.5.0

  # ─── Storage ─────────────────────────────────────────
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ─── Networking ──────────────────────────────────────
  http: ^1.2.0
  cached_network_image: ^3.4.0

  # ─── Firebase & Push Notifications ───────────────────
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.0

  # ─── Haptics ──────────────────────────────────────────
  vibration: ^2.0.0

  # ─── Permissions ─────────────────────────────────────
  permission_handler: ^11.3.0

  # ─── Device/App Info ─────────────────────────────────
  package_info_plus: ^8.1.0
  device_info_plus: ^11.1.0

  # ─── URL / File Handling ─────────────────────────────
  url_launcher: ^6.3.0
  image_picker: ^1.1.0
  file_picker: ^8.1.4
  path_provider: ^2.1.4
  share_plus: ^10.0.0

  # ─── Auth & Payments ─────────────────────────────────
  local_auth: ^2.3.0
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.2
  crypto: ^3.0.3
  razorpay_flutter: ^1.3.7

  # ─── State Management & UI Utilities ─────────────────
  provider: ^6.1.2
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

# ─── Flutter Launcher Icons Configuration ──────────────
flutter_launcher_icons:
  android: true
  ios: false
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
